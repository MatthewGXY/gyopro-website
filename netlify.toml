[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Admin CMS needs no cache
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ─────────────────────────────────────────────────────────────
# Domain redirects — all alternate hosts → primary gyopro.com.au
# Try absolute URL form (matching Netlify's documented examples)
# ─────────────────────────────────────────────────────────────
[[redirects]]
  from = "https://gyopro.net.au"
  to = "https://gyopro.com.au/"
  status = 301
  force = true

[[redirects]]
  from = "https://gyopro.net.au/*"
  to = "https://gyopro.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.gyopro.net.au/*"
  to = "https://gyopro.com.au/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.gyopro.com.au/*"
  to = "https://gyopro.com.au/:splat"
  status = 301
  force = true