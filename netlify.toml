[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Cache static assets aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Admin CMS needs no cache
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ─────────────────────────────────────────────────────────────
# Domain redirects — all alternate hosts → primary gyopro.com.au
# Split into one rule per host (array form may not parse reliably)
# ─────────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "https://gyopro.com.au/:splat"
  status = 301
  force = true
  conditions = {Host = "gyopro.net.au"}

[[redirects]]
  from = "/*"
  to = "https://gyopro.com.au/:splat"
  status = 301
  force = true
  conditions = {Host = "www.gyopro.net.au"}

[[redirects]]
  from = "/*"
  to = "https://gyopro.com.au/:splat"
  status = 301
  force = true
  conditions = {Host = "www.gyopro.com.au"}